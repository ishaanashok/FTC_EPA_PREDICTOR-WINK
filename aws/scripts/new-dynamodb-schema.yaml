AWSTemplateFormatVersion: '2010-09-09'
Description: 'DynamoDB Tables for FTC-Predictor - New Schema Design'

Parameters:
  Environment:
    Type: String
    Default: stage
    AllowedValues:
      - dev
      - stage
      - prod
    Description: Environment name for resource naming

Resources:
  # ============================================================================
  # Teams Table
  # ============================================================================
  FTCTeamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'FTC_Teams_${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teamNumber
          AttributeType: N
        - AttributeName: season
          AttributeType: N
        - AttributeName: country
          AttributeType: S
        - AttributeName: homeRegion
          AttributeType: S
      KeySchema:
        - AttributeName: teamNumber
          KeyType: HASH
        - AttributeName: season
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SeasonIndex
          KeySchema:
            - AttributeName: season
              KeyType: HASH
            - AttributeName: teamNumber
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CountrySeasonIndex
          KeySchema:
            - AttributeName: country
              KeyType: HASH
            - AttributeName: season
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: RegionSeasonIndex
          KeySchema:
            - AttributeName: homeRegion
              KeyType: HASH
            - AttributeName: season
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: FTC-Predictor
        - Key: DataType
          Value: Teams

  # ============================================================================
  # Events Table
  # ============================================================================
  FTCEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'FTC_Events_${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: season
          AttributeType: N
        - AttributeName: code
          AttributeType: S
        - AttributeName: dateStart
          AttributeType: S
        - AttributeName: regionCode
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CodeSeasonIndex
          KeySchema:
            - AttributeName: code
              KeyType: HASH
            - AttributeName: season
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: SeasonDateIndex
          KeySchema:
            - AttributeName: season
              KeyType: HASH
            - AttributeName: dateStart
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: RegionSeasonIndex
          KeySchema:
            - AttributeName: regionCode
              KeyType: HASH
            - AttributeName: season
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: FTC-Predictor
        - Key: DataType
          Value: Events

  # ============================================================================
  # Matches Table
  # ============================================================================
  FTCMatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'FTC_Matches_${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: matchId
          AttributeType: S
        - AttributeName: season
          AttributeType: N
        - AttributeName: eventCode
          AttributeType: S
        - AttributeName: eventCode_matchNumber
          AttributeType: S
      KeySchema:
        - AttributeName: matchId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EventSeasonIndex
          KeySchema:
            - AttributeName: eventCode
              KeyType: HASH
            - AttributeName: season
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: EventMatchNumberIndex
          KeySchema:
            - AttributeName: eventCode_matchNumber
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: SeasonIndex
          KeySchema:
            - AttributeName: season
              KeyType: HASH
            - AttributeName: matchId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: FTC-Predictor
        - Key: DataType
          Value: Matches

  # ============================================================================
  # Team Match EPA Table
  # ============================================================================
  FTCTeamMatchEPATable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'FTC_TeamMatchEPA_${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teamNumber_matchId
          AttributeType: S
        - AttributeName: teamNumber
          AttributeType: N
        - AttributeName: season
          AttributeType: N
        - AttributeName: eventCode
          AttributeType: S
        - AttributeName: matchId
          AttributeType: S
        - AttributeName: actualStartTime
          AttributeType: S
      KeySchema:
        - AttributeName: teamNumber_matchId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TeamSeasonIndex
          KeySchema:
            - AttributeName: teamNumber
              KeyType: HASH
            - AttributeName: season
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: TeamEventIndex
          KeySchema:
            - AttributeName: teamNumber
              KeyType: HASH
            - AttributeName: eventCode
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: EventMatchIndex
          KeySchema:
            - AttributeName: eventCode
              KeyType: HASH
            - AttributeName: matchId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: TeamSeasonTimeIndex
          KeySchema:
            - AttributeName: teamNumber
              KeyType: HASH
            - AttributeName: actualStartTime
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: SeasonIndex
          KeySchema:
            - AttributeName: season
              KeyType: HASH
            - AttributeName: teamNumber_matchId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: FTC-Predictor
        - Key: DataType
          Value: TeamMatchEPA

Outputs:
  TeamsTableName:
    Description: Name of the Teams DynamoDB table
    Value: !Ref FTCTeamsTable
    Export:
      Name: !Sub '${Environment}-FTC-Teams-Table'

  EventsTableName:
    Description: Name of the Events DynamoDB table
    Value: !Ref FTCEventsTable
    Export:
      Name: !Sub '${Environment}-FTC-Events-Table'

  MatchesTableName:
    Description: Name of the Matches DynamoDB table
    Value: !Ref FTCMatchesTable
    Export:
      Name: !Sub '${Environment}-FTC-Matches-Table'

  TeamMatchEPATableName:
    Description: Name of the Team Match EPA DynamoDB table
    Value: !Ref FTCTeamMatchEPATable
    Export:
      Name: !Sub '${Environment}-FTC-TeamMatchEPA-Table'

  TeamsTableArn:
    Description: ARN of the Teams DynamoDB table
    Value: !GetAtt FTCTeamsTable.Arn
    Export:
      Name: !Sub '${Environment}-FTC-Teams-Table-Arn'

  EventsTableArn:
    Description: ARN of the Events DynamoDB table
    Value: !GetAtt FTCEventsTable.Arn
    Export:
      Name: !Sub '${Environment}-FTC-Events-Table-Arn'

  MatchesTableArn:
    Description: ARN of the Matches DynamoDB table
    Value: !GetAtt FTCMatchesTable.Arn
    Export:
      Name: !Sub '${Environment}-FTC-Matches-Table-Arn'

  TeamMatchEPATableArn:
    Description: ARN of the Team Match EPA DynamoDB table
    Value: !GetAtt FTCTeamMatchEPATable.Arn
    Export:
      Name: !Sub '${Environment}-FTC-TeamMatchEPA-Table-Arn'

