AWSTemplateFormatVersion: '2010-09-09'
Description: 'Upcoming Events Sync Lambda (standalone stack)'

Parameters:
  Environment:
    Type: String
    Default: stage
    AllowedValues:
      - dev
      - stage
      - prod
    Description: Environment name for resource naming
  SecretsName:
    Type: String
    Default: FTC-API-Credentials-stage
    Description: Secrets Manager name for FTC API credentials
  LookaheadDays:
    Type: Number
    Default: 30
    Description: Number of days to look ahead for upcoming events
  RoleName:
    Type: String
    Default: FTC-Lambda-Role-stage
    Description: Existing IAM role name for the Lambda function

Resources:
  EventsUpcomingSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ftc-events-upcoming-sync-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${RoleName}'
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          SECRETS_NAME: !Ref SecretsName
          LOOKAHEAD_DAYS: !Ref LookaheadDays
          SEASON: '2025'
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': 'Placeholder - deploy actual code'
              }
      Description: 'Upcoming Events Sync - Adds new scheduled events in next 30 days'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: FTC-Predictor

  EventsUpcomingSyncRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'ftc-events-upcoming-sync-${Environment}'
      Description: 'Run upcoming events sync daily'
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Arn: !GetAtt EventsUpcomingSyncFunction.Arn
          Id: EventsUpcomingSyncTarget

  EventsUpcomingSyncPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt EventsUpcomingSyncFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventsUpcomingSyncRule.Arn

Outputs:
  EventsUpcomingSyncFunctionArn:
    Description: ARN of Upcoming Events Sync Lambda function
    Value: !GetAtt EventsUpcomingSyncFunction.Arn
