  AllianceMatchmakerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ftc-alliance-matchmaker-${Environment}'
      RetentionInDays: 7

  # ============================================================================
  # Teams Sync Lambda
  # ============================================================================
  TeamsSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ftc-teams-sync-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          FTC_API_USERNAME: '{{resolve:secretsmanager:ftc-api-credentials:SecretString:username}}'
          FTC_API_TOKEN: '{{resolve:secretsmanager:ftc-api-credentials:SecretString:token}}'
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': 'Placeholder - deploy actual code'
              }
      Description: 'Teams Sync - Syncs team data from FTC API to DynamoDB'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: FTC-Predictor

  TeamsSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ftc-teams-sync-${Environment}'
      RetentionInDays: 7

  # ============================================================================
  # Events Sync Lambda
  # ============================================================================
  EventsSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ftc-events-sync-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          FTC_API_USERNAME: '{{resolve:secretsmanager:ftc-api-credentials:SecretString:username}}'
          FTC_API_TOKEN: '{{resolve:secretsmanager:ftc-api-credentials:SecretString:token}}'
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': 'Placeholder - deploy actual code'
              }
      Description: 'Events Sync - Syncs event data from FTC API to DynamoDB'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: FTC-Predictor

  EventsSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ftc-events-sync-${Environment}'
      RetentionInDays: 7

  # ============================================================================
  # Upcoming Events Sync Lambda
  # ============================================================================
  EventsUpcomingSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ftc-events-upcoming-sync-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          SECRETS_NAME: !Sub 'FTC-API-Credentials-${Environment}'
          LOOKAHEAD_DAYS: '30'
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': 'Placeholder - deploy actual code'
              }
      Description: 'Upcoming Events Sync - Adds new scheduled events in next 30 days'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: FTC-Predictor

  EventsUpcomingSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ftc-events-upcoming-sync-${Environment}'
      RetentionInDays: 7

  EventsUpcomingSyncRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'ftc-events-upcoming-sync-${Environment}'
      Description: 'Run upcoming events sync daily'
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Arn: !GetAtt EventsUpcomingSyncFunction.Arn
          Id: EventsUpcomingSyncTarget

  EventsUpcomingSyncPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt EventsUpcomingSyncFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventsUpcomingSyncRule.Arn

  # ============================================================================
  # Matches Sync Lambda
  # ============================================================================
  MatchesSyncFunction:
    Type: AWS::Lambda::Function
    Properties:
