          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': 'Placeholder - deploy actual code'
              }
      Description: 'EPA API - Comprehensive EPA endpoints (historic, season, event)'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: FTC-Predictor

  EpaApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ftc-epa-api-${Environment}'
      RetentionInDays: 7

  # ============================================================================
  # Events API Lambda
  # ============================================================================
  EventsApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ftc-events-api-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Code:
