  EventsApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ftc-events-api-${Environment}'
      RetentionInDays: 7

  # ============================================================================
  # Matches API Lambda
  # ============================================================================
  MatchesApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ftc-matches-api-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': 'Placeholder - deploy actual code'
              }
      Description: 'Matches API - Returns match data with win probabilities'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: FTC-Predictor

  MatchesApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ftc-matches-api-${Environment}'
      RetentionInDays: 7

  # ============================================================================
  # Alliance Matchmaker Lambda
  # ============================================================================
  AllianceMatchmakerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ftc-alliance-matchmaker-${Environment}'
      Runtime: python3.11
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 1024
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {
