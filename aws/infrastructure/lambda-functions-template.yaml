Outputs:
  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaExecutionRoleArn'

  TeamsApiFunctionArn:
    Description: ARN of Teams API Lambda function
    Value: !GetAtt TeamsApiFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TeamsApiFunctionArn'

  EpaApiFunctionArn:
    Description: ARN of EPA API Lambda function
    Value: !GetAtt EpaApiFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EpaApiFunctionArn'

  EventsApiFunctionArn:
    Description: ARN of Events API Lambda function
    Value: !GetAtt EventsApiFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EventsApiFunctionArn'

  MatchesApiFunctionArn:
    Description: ARN of Matches API Lambda function
    Value: !GetAtt MatchesApiFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-MatchesApiFunctionArn'

  AllianceMatchmakerFunctionArn:
    Description: ARN of Alliance Matchmaker Lambda function
    Value: !GetAtt AllianceMatchmakerFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AllianceMatchmakerFunctionArn'

  TeamsSyncFunctionArn:
