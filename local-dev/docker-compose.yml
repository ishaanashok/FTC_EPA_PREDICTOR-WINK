version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ftc-predictor-db
    environment:
      POSTGRES_DB: ftc_predictor
      POSTGRES_USER: ftc_dev
      POSTGRES_PASSWORD: ftc_dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftc_dev -d ftc_predictor"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ftc-predictor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ftc-predictor.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
